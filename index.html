<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title> MACAN & GitHub </title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fe9a8b 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }
  
    .macan-photo {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 6px solid #ff4081;
      box-shadow: 0 10px 30px rgba(255, 64, 129, 0.5);
      margin-bottom: 20px;
      object-fit: cover;
      z-index: 10;
      transition: transform 0.3s ease, rotate 0.3s ease;
    }
  
    .macan-photo:hover { transform: scale(1.08) rotate(5deg); }
  
    h1 {
      color: white;
      text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.2);
      font-size: 2.5rem;
      margin: 0 0 20px 0;
      z-index: 10;
    }
  
    button {
      color: white;
      border: none;
      padding: 15px 35px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }

    #login-btn {
      background: #ff4081;
      box-shadow: 0 10px 25px rgba(255, 64, 129, 0.4);
    }
  
    #login-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(255, 64, 129, 0.6);
    }

    #logout-btn {
      background: #4a4a4a;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    #logout-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
    }
  
    #user-info {
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
      margin-top: 20px;
      text-shadow: 1px 2px 5px rgba(0,0,0,0.15);
      z-index: 10;
    }

    #db-section {
      z-index: 10;
      margin-top: 15px;
      text-align: center;
    }

    #db-input {
      padding: 10px 15px;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 1rem;
      margin-right: 10px;
    }

    #db-write-btn {
      background: #28a745;
      padding: 10px 25px;
      font-size: 1rem;
    }
  
    .poop-emoji {
      position: absolute;
      bottom: -60px;
      font-size: 2.5rem;
      user-select: none;
      pointer-events: none;
      animation: flyUp 6s linear infinite;
      opacity: 0;
      z-index: 1;
    }
  
    @keyframes flyUp {
      0% { bottom: -60px; opacity: 0; transform: translateX(0) rotate(0deg); }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { bottom: 110vh; opacity: 0; transform: translateX(120px) rotate(360deg); }
    }
  </style>
</head>
<body>

  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRST8KXhD3P-s6M7lGlNwocjk3K_pgyKsdWZmas7BpxmQ&s=10" alt="MACAN" class="macan-photo">
  <h1> MACAN & GitHub </h1>
  
  <button id="login-btn"> Войти через GitHub нафиг</button>
  <button id="logout-btn" style="display: none;">🚪 Выйти из GitHub нафиг</button>
  <p id="user-info"></p>
  <button id="login-btn"> Войти через Google нафиг</button>
  <button id="logout-btn" style="display: none;">🚪 Выйти из Google нафиг</button>
  <p id="user-info"></p>

  <div id="db-section" style="display: none;">
    <input type="text" id="db-input" placeholder="Напиши что-нибудь...">
    <button id="db-write-btn">Сохранить в БД</button>
    <p id="db-display" style="color: white; font-weight: bold; margin-top: 15px; text-shadow: 1px 1px 5px rgba(0,0,0,0.3);"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GithubAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyDskCVQfkwKRmODPh3rwMxOSth5loHv_7M",
      authDomain: "isakk-c0092.firebaseapp.com",
      projectId: "isakk-c0092",
      databaseURL: "https://isakk-c0092-default-rtdb.firebaseio.com",
      storageBucket: "isakk-c0092.firebasestorage.app",
      messagingSenderId: "538175160568",
      appId: "1:538175160568:web:e5e5696863f2cc069afb0d",
      measurementId: "G-ETFG9RPS31"
    };
  
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GithubAuthProvider();

    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userInfo = document.getElementById("user-info");
    const dbSection = document.getElementById("db-section");
    const dbInput = document.getElementById("db-input");
    const dbWriteBtn = document.getElementById("db-write-btn");
    const dbDisplay = document.getElementById("db-display");

    let unsubscribeDb = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        userInfo.textContent = `Привет, ${user.displayName || user.email}!`;
        dbSection.style.display = "block";

        const userRef = ref(db, 'something/' + user.uid);
        unsubscribeDb = onValue(userRef, (snapshot) => {
          const data = snapshot.val();
          dbDisplay.textContent = data ? `Из БД: ${data.message}` : "В БД пока пусто.";
        });
      } else {
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        userInfo.textContent = "";
        dbSection.style.display = "none";
        dbDisplay.textContent = "";
        if (unsubscribeDb) {
          unsubscribeDb();
          unsubscribeDb = null;
        }
      }
    });

    dbWriteBtn.addEventListener("click", () => {
      const user = auth.currentUser;
      if (user && dbInput.value.trim() !== "") {
        set(ref(db, 'something/' + user.uid), {
          message: dbInput.value,
          updatedAt: Date.now()
        }).then(() => {
          dbInput.value = "";
        }).catch(err => console.error("Ошибка записи:", err));
      }
    });

    loginBtn.addEventListener("click", () => {
      signInWithPopup(auth, provider).catch(error => {
        userInfo.textContent = "Ошибка при входе: " + error.message;
      });
    });

    logoutBtn.addEventListener("click", () => {
      signOut(auth).catch(err => console.error(err));
    });
  </script>
  
  <script>
    function spawnPoop() {
      const poop = document.createElement('div');
      poop.classList.add('poop-emoji');
      poop.innerText = '💩';
      poop.style.left = Math.random() * 100 + 'vw';
      poop.style.animationDuration = (Math.random() * 3 + 4) + 's';
      poop.style.fontSize = (Math.random() * 1.5 + 1.5) + 'rem';
      document.body.appendChild(poop);
      setTimeout(() => poop.remove(), 7000);
    }
    setInterval(spawnPoop, 500);
  </script>
</body>
</html>
