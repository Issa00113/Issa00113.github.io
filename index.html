<!-- Добавим кнопку для входа и элемент для отображения имени пользователя -->
<button id="login-btn">Войти через GitHub</button>
<h2 id="user-info"></h2>

<script type="module">
    // Импортируем функции Firebase App и Analytics
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-analytics.js";
    
    // Импортируем необходимые инструменты авторизации
    import { getAuth, signInWithPopup, GithubAuthProvider } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
  
    // Твоя конфигурация Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDskCVQfkwKRmODPh3rwMxOSth5loHv_7M",
      authDomain: "isakk-c0092.firebaseapp.com",
      projectId: "isakk-c0092",
      storageBucket: "isakk-c0092.firebasestorage.app",
      messagingSenderId: "538175160568",
      appId: "1:538175160568:web:e5e5696863f2cc069afb0d",
      measurementId: "G-ETFG9RPS31"
    };
  
    // Инициализируем Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);

    // Инициализируем Firebase Auth и провайдер GitHub
    const auth = getAuth(app);
    const provider = new GithubAuthProvider();

    // Находим элементы на странице
    const loginBtn = document.getElementById("login-btn");
    const userInfo = document.getElementById("user-info");

    // Добавляем обработчик нажатия на кнопку
    loginBtn.addEventListener("click", () => {
      signInWithPopup(auth, provider)
        .then((result) => {
          // Успешный вход! Получаем данные пользователя
          const user = result.user;
          userInfo.textContent = `Привет, ${user.displayName || user.email}!`;
          console.log("Данные пользователя:", user);
        })
        .catch((error) => {
          // Обрабатываем возможные ошибки
          console.error("Ошибка авторизации:", error);
          userInfo.textContent = "Ошибка при входе: " + error.message;
        });
    });
</script>

  <script>
    // Генератор летающих какашек 💩
    function spawnPoop() {
      const poop = document.createElement('div');
      poop.classList.add('poop-emoji');
      poop.innerText = '💩';
      
      // Случайная позиция по горизонтали, скорость движения и размер
      poop.style.left = Math.random() * 100 + 'vw';
      poop.style.animationDuration = (Math.random() * 3 + 4) + 's'; // от 4 до 7 секунд
      poop.style.fontSize = (Math.random() * 1.5 + 1.5) + 'rem';
      
      document.body.appendChild(poop);
  
      // Удаляем смайлик после завершения анимации
      setTimeout(() => {
        poop.remove();
      }, 7000);
    }
  
    // Запуск летающих какашек каждые полсекунды
    setInterval(spawnPoop, 500);
  </script>
